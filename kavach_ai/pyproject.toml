[project]
name = "kavach-ai"
version = "0.1.0"
description = "Kavach.ai Android malware analysis backend and SOC dashboard."
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.20.0",
    "arq>=0.26.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.111.0",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.21",
    "uvicorn[standard]>=0.30.0",
    "redis>=4.6.0",
    "pydantic>=2.0",
    "androguard>=3.4.0a1",
    "streamlit>=1.24.0",
    "plotly>=5.15.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
training = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "peft>=0.4.0",
    "accelerate>=0.20.0",
    "pyaxmlparser>=0.3.9",
    "scikit-learn",
    "pandas",
    "numpy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
addopts = ["-p", "no:cacheprovider"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
testpaths = ["backend/tests"]
