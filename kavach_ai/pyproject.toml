[project]
name = "kavach-ai"
version = "0.1.0"
description = "Android Malware Detection and Forensic Reporting Pipeline"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "sqlmodel>=0.0.8",
    "asyncpg>=0.28.0",
    "redis>=4.6.0",
    "arq>=0.25.0",
    "pydantic>=2.0",
    "androguard>=3.4.0a1",
    "streamlit>=1.24.0",
    "plotly>=5.15.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
training = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "peft>=0.4.0",
    "accelerate>=0.20.0",
    "pyaxmlparser>=0.3.9",
    "scikit-learn",
    "pandas",
    "numpy"
]
