services:
  # 1. Database Layer
  postgres:
    image: postgres:15-alpine
    container_name: kavach_postgres
    restart: always
    environment:
      POSTGRES_USER: kavach_user
      POSTGRES_PASSWORD: kavach_password
      POSTGRES_DB: kavach_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kavach_network

  # 2. FastAPI Orchestrator Backend
  api:
    build:
      context: ../
      dockerfile: infrastructure/Dockerfile.api
    container_name: kavach_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://kavach_user:kavach_password@postgres:5432/kavach_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
    networks:
      - kavach_network

  # 3. React UI Dashboard
  frontend:
    build:
      context: ../
      dockerfile: infrastructure/Dockerfile.frontend
    container_name: kavach_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - kavach_network

volumes:
  postgres_data:
    driver: local

networks:
  kavach_network:
    driver: bridge


