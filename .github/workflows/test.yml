name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e "./kavach_ai[dev]" --no-build-isolation || pip install -e "./kavach_ai" --no-build-isolation || true
        pip install pytest pytest-asyncio pytest-cov httpx fastapi pydantic sqlmodel

    - name: Run backend test suite
      env:
        PYTHONPATH: kavach_ai
      run: |
        pytest kavach_ai/backend/tests/


  frontend-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-package-json-path: kavach_ai/frontend/package-lock.json

    - name: Install & Check Frontend
      run: |
        cd kavach_ai/frontend
        npm ci
        npm run lint
        npm run build

